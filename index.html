<!doctype html>

<head>

  <link rel="icon" href="assets/logos/ecapture.svg" type="image/svg+xml">
  <link rel="preload" href="assets/landscape.png?v=c9397d20" as="image" fetchpriority="high">
  <link rel="stylesheet" href="styles/site.css?v=computing-v1">
  <script type="module" src="scripts/app.js"></script>
</head>
<body>
  <svg class="svg-definitions" aria-hidden="true" width="0" height="0">
    <defs>
      <clipPath id="skills-silhouette" clipPathUnits="objectBoundingBox">
        <path transform="scale(.0007974481659)" d="M352 129H902C928 129 947 143 962 166L1219 558C1234 581 1234 603 1220 626L930 1086C914 1112 895 1124 867 1124H382C355 1124 338 1112 323 1088L36 624C21 601 21 580 36 557L298 164C312 142 329 129 352 129Z"/>
      </clipPath>
      <symbol id="github-icon" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.77-.244.77-.543 0-.267-.01-.974-.016-1.912-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.647-1.25-1.647-1.023-.7.078-.686.078-.686 1.13.08 1.726 1.16 1.726 1.16 1.006 1.725 2.64 1.227 3.283.938.102-.729.394-1.227.715-1.51-2.499-.284-5.126-1.249-5.126-5.56 0-1.23.44-2.234 1.16-3.022-.116-.285-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.154A10.8 10.8 0 0 1 12 6.178c.956.005 1.92.129 2.82.38 2.148-1.457 3.091-1.155 3.091-1.155.615 1.551.228 2.696.112 2.981.722.788 1.159 1.792 1.159 3.022 0 4.322-2.631 5.273-5.138 5.552.404.35.765 1.04.765 2.097 0 1.514-.014 2.736-.014 3.108 0 .302.203.653.774.542A11.252 11.252 0 0 0 12 .75Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="experience" id="experience">
    <div class="landscape" aria-hidden="true"></div>
    <header class="site-header">
      <button class="wordmark" id="about-button" type="button" aria-label="关于 gojue" title="关于 gojue">gojue<span aria-hidden="true"></span></button>
      <nav class="header-actions" aria-label="网站链接与语言">
        <a class="github-link" href="https://github.com/gojue" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 gojue" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#github-icon"/></svg>
        </a>
        <button class="language-toggle" id="language-toggle" type="button" aria-label="Switch to English / 切换到英文" title="Switch to English / 切换到英文" data-language="zh">
          <span class="language-glyph" aria-hidden="true"><span lang="zh">文</span><span class="language-slash">/</span><span lang="en">A</span></span>
        </button>
      </nav>
    </header>

    <div class="hero" id="hero">
      <h1>俏也不争春，<span>只把春来报。</span></h1>
      <p>由爱好者与贡献者共建的非营利技术社区，让开源成果惠及更多人。</p>
    </div>

    <main class="constellation" id="constellation" aria-label="gojue 项目生态" aria-describedby="scene-instructions">
      <p class="visually-hidden" id="scene-instructions">将鼠标移到副项目 LOGO 上，显示名称、说明与关联连线。点击任一项目 LOGO，包括中心的 eCapture，查看项目介绍。也可使用 Tab 键选择、回车打开、Escape 关闭。触摸屏可直接点击 LOGO。</p>
      <svg class="connections" id="connections" aria-hidden="true">
        <g class="connection" data-connection="skills"><path class="connection-base"/><path class="connection-glow"/><path class="connection-flow" pathLength="1000"/></g>
        <g class="connection" data-connection="q"><path class="connection-base"/><path class="connection-glow"/><path class="connection-flow" pathLength="1000"/></g>
        <g class="connection" data-connection="manager"><path class="connection-base"/><path class="connection-glow"/><path class="connection-flow" pathLength="1000"/></g>
        <g class="connection" data-connection="decryptor"><path class="connection-base"/><path class="connection-glow"/><path class="connection-flow" pathLength="1000"/></g>
      </svg>
      <span class="connection-label" data-label="skills" aria-hidden="true">智能调用</span>
      <span class="connection-label" data-label="q" aria-hidden="true">采集数据</span>
      <span class="connection-label" data-label="manager" aria-hidden="true">探针管理</span>
      <span class="connection-label" data-label="decryptor" aria-hidden="true">解密能力</span>

      <div class="project project-core" data-project="ecapture">
        <button class="project-button" type="button" data-open="ecapture" aria-label="eCapture，TLS 明文采集，查看项目详情" aria-haspopup="dialog">
          <span class="logo-anchor">
            <svg class="project-logo core-logo" id="core-logo" viewBox="0 0 1254 1254" fill="none" aria-hidden="true">
              <image href="assets/logos/homepage-3d/ecapture-body.png?v=satin-v1" width="1254" height="1254"/>
              <!-- Keep the satin eyes separate so the existing pointer animation can move them. -->
              <g id="bee-eyes">
                <image href="assets/logos/homepage-3d/eye.png?v=satin-v1" x="514" y="329" width="96" height="96"/>
                <image href="assets/logos/homepage-3d/eye.png?v=satin-v1" x="644" y="329" width="96" height="96"/>
              </g>
            </svg>
          </span>
          <span class="project-caption"><span class="project-name">eCapture</span></span>
        </button>
      </div>

      <div class="project project-satellite project-skills" data-project="skills">
        <button class="project-button" type="button" data-open="skills" aria-label="ecapture Skill，AI Agent 技能，查看项目详情" aria-haspopup="dialog">
          <span class="logo-anchor"><span class="floating-logo"><img class="project-logo" src="assets/logos/homepage-3d/ecapture-skills.png?v=satin-v1" width="1254" height="1254" alt="" draggable="false"></span></span>
          <span class="project-caption"><span class="project-name">ecapture Skill</span><span class="project-subtitle">AI Agent 技能</span></span>
        </button>
      </div>
      <div class="project project-satellite project-q" data-project="q">
        <button class="project-button" type="button" data-open="q" aria-label="eCaptureQ，图形化流量分析，查看项目详情" aria-haspopup="dialog">
          <span class="logo-anchor"><span class="floating-logo"><img class="project-logo" src="assets/logos/homepage-3d/ecaptureq.png?v=satin-v1" width="1254" height="1254" alt="" draggable="false"></span></span>
          <span class="project-caption"><span class="project-name">eCaptureQ</span><span class="project-subtitle">图形化流量分析</span></span>
        </button>
      </div>
      <div class="project project-satellite project-manager" data-project="manager">
        <button class="project-button" type="button" data-open="manager" aria-label="ebpfmanager，eBPF 底层管理，查看项目详情" aria-haspopup="dialog">
          <span class="logo-anchor"><span class="floating-logo"><img class="project-logo" src="assets/logos/homepage-3d/ebpfmanager.png?v=satin-v1" width="1254" height="1254" alt="" draggable="false"></span></span>
          <span class="project-caption"><span class="project-name">ebpfmanager</span><span class="project-subtitle">eBPF 底层管理</span></span>
        </button>
      </div>
      <div class="project project-satellite project-decryptor" data-project="decryptor">
        <button class="project-button" type="button" data-open="decryptor" aria-label="eCapture Decryptor，TLS 与 QUIC 解密及解析，查看项目详情" aria-haspopup="dialog">
          <span class="logo-anchor"><span class="floating-logo"><img class="project-logo" src="assets/logos/homepage-3d/ecapture-decryptor.png?v=satin-v1" width="1254" height="1254" alt="" draggable="false"></span></span>
          <span class="project-caption"><span class="project-name">eCapture Decryptor</span><span class="project-subtitle">TLS / QUIC 解密与解析</span></span>
        </button>
      </div>
    </main>
    <div class="dialog-backdrop" id="dialog-backdrop" hidden aria-hidden="true"></div>
  </div>

  <dialog class="detail-dialog" id="detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
    <button class="close-button" id="close-detail" type="button" aria-label="关闭项目详情" autofocus><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="detail-content" id="detail-content"></div>
  </dialog>
  <noscript><div class="noscript-note">请启用 JavaScript 探索项目，或直接访问 <a href="https://github.com/gojue">gojue GitHub</a>。</div></noscript>
</body>
</html>
